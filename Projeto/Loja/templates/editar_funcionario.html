<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Adicionar Utilizador</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Funcionário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header,
        footer {
            text-align: center;
            padding: 10px;
        }

        header {
            background-color: #4CAF50;
            color: white;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
        }

        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea,
        button {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <h1>Gestão de Funcionários</h1>
        <p>Adicione novos funcionários facilmente</p>
    </header>

    
    <nav>
        <a href="{% url 'home' %}">Início</a>
        <a href="{% url 'gestor_lista' %}">Produtos</a>
        <a href="{% url 'lista_utilizadores' %}">Funcionarios</a>
        <a href="{% url 'listar_encomendas' %}">Encomendas</a>
        
        <!-- Botão de login/logout -->
        {% if request.session.user_id %}
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    <h1>Editar Funcionário</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="nome">Nome</label>
        <input type="text" name="nome" value="{{ funcionario.1 }}" required>

        <label for="email">Email</label>
        <input type="email" name="email" value="{{ funcionario.2 }}" required>

        <label for="password">Password</label>
        <input type="password" name="password" value="{{ funcionario.3 }}" required>

        <label for="morada">Morada</label>
        <input type="text" name="morada" value="{{ funcionario.5 }}" required>

        <label for="telefone">Telefone</label>
        <input type="text" name="telefone" value="{{ funcionario.6 }}" required>

        <label for="funcoes">Funções</label>
        <input type="text" name="funcoes" value="{{ funcionario.4 }}" required>

        <button type="submit">Salvar Alterações</button>
    </form>
    
    <footer>
        <p>&copy; 2024 Supermercado Online - Todos os Direitos Reservados</p>
    </footer>
</body>

</html>
